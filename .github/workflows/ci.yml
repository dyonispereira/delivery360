name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: delivery
          POSTGRES_PASSWORD: delivery
          POSTGRES_DB: delivery360_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U delivery" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://delivery:delivery@localhost:5432/delivery360_test?schema=public
      TEST_DATABASE_URL: postgresql://delivery:delivery@localhost:5432/delivery360_test?schema=public
      JWT_SECRET: ci-secret
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @delivery360/shared build
      - run: pnpm typecheck
      - run: pnpm --filter @delivery360/api test
      - run: pnpm --filter @delivery360/api test:e2e
      - run: pnpm --filter @delivery360/web build
